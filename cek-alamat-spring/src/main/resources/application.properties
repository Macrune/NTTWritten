spring.application.name=cek-alamat
server.port=8080

# Base URL API publik (dipanggil, tidak dibuat di local)
alamat.base-url=https://alamat.thecloudalert.com/api

# Timeout panggilan ke API publik
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# Truststore berisi intermediate Certum (server API publik tidak mengirimnya)
spring.ssl.bundle.jks.certum.truststore.location=classpath:truststore.jks
spring.ssl.bundle.jks.certum.truststore.password=changeit
